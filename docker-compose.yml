# Entorno local del servicio de solicitudes: su propia base MySQL (BD-01) y la API.
# Uso: cp .env.example .env && docker compose up --build
services:
  request-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - request-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  request-service:
    build: .
    environment:
      SERVER_PORT: ${SERVER_PORT:-8084}
      DB_HOST: request-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${SERVER_PORT:-8084}:${SERVER_PORT:-8084}"
    depends_on:
      request-db:
        condition: service_healthy

volumes:
  request-db-data:
