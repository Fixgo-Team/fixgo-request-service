# Toda la configuración sale de variables de entorno (RNF-23). Los valores por defecto son solo para desarrollo local.
spring.application.name=fixgo-request-service
server.port=${SERVER_PORT:8084}

# Conexión a MySQL (base propia del servicio, BD-01)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:fixgo_request}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:fixgo}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
# BD-04: Hibernate solo valida el esquema; lo crean y modifican las migraciones de Flyway (no se usa "update")
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# BD-02: fechas en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger / OpenAPI (RNF-16)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Monitoreo: salud y métricas (RNF-24)
management.endpoints.web.exposure.include=health,info,metrics
